<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        let date = new Date();
        let hours = date.getHours();

        if (hours < 12) {
            alert("오전입니다.");
        }

        else if (12 <= hours && hours < 18) {
            alert("오후입니다.");
        }

        else {
            alert("저녁인데요.");
        }
    </script>
</head>

</body>
</html>
